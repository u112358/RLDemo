<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket Cube Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --ground: #EDEFF3;
    --panel: #FFFFFF;
    --panel-2: #F5F6F9;
    --ink: #171A21;
    --muted: #5F6778;
    --line: #D5D9E2;
    --line-strong: #B9BFCC;
    --btn: #1E222B;
    --btn-ink: #F4F5F8;
    --btn-2: #E6E9EF;
    --focus: #2E67D9;
    --good: #1E8E4E;
    --good-bg: #DDF3E5;
    --warn: #B4531B;
    --warn-bg: #FBE9DC;
    --stage: radial-gradient(120% 90% at 50% 40%, #FAFBFD 0%, #E4E7EE 100%);
    --display: "Bricolage Grotesque", "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    --body: "IBM Plex Sans", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #101216;
      --panel: #181B21;
      --panel-2: #1F232B;
      --ink: #E9EBF0;
      --muted: #9AA1B0;
      --line: #2A2F3A;
      --line-strong: #3B4250;
      --btn: #E9EBF0;
      --btn-ink: #14171D;
      --btn-2: #262B35;
      --focus: #6C9BFF;
      --good: #4CC97E;
      --good-bg: #17331F;
      --warn: #F0A06A;
      --warn-bg: #3A2416;
      --stage: radial-gradient(120% 90% at 50% 40%, #232833 0%, #121419 100%);
    }
  }
  :root[data-theme="dark"] {
    --ground: #101216;
    --panel: #181B21;
    --panel-2: #1F232B;
    --ink: #E9EBF0;
    --muted: #9AA1B0;
    --line: #2A2F3A;
    --line-strong: #3B4250;
    --btn: #E9EBF0;
    --btn-ink: #14171D;
    --btn-2: #262B35;
    --focus: #6C9BFF;
    --good: #4CC97E;
    --good-bg: #17331F;
    --warn: #F0A06A;
    --warn-bg: #3A2416;
    --stage: radial-gradient(120% 90% at 50% 40%, #232833 0%, #121419 100%);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: 14px;
    line-height: 1.5;
    padding-block: 20px 32px;
    padding-inline: 20px;
  }
  .app { max-width: 1180px; margin: 0 auto; display: grid; gap: 16px; }

  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
  h1 { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.1; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  .sub { color: var(--muted); margin: 4px 0 0; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; min-width: 112px; }
  .stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .stat .v { font-family: var(--display); font-size: 24px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 8px; }
  .stat .v small { font-family: var(--body); font-size: 12px; font-weight: 500; color: var(--muted); }
  .pips { display: inline-flex; gap: 3px; vertical-align: middle; }
  .pip { width: 9px; height: 9px; border-radius: 2px; background: var(--line); }
  .pip.on { background: var(--good); }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--btn-2); color: var(--muted); }
  .pill.good { background: var(--good-bg); color: var(--good); }

  main { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 380px); gap: 16px; align-items: start; }
  @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } }

  .stage { position: relative; background: var(--stage); border: 1px solid var(--line); border-radius: 12px; aspect-ratio: 1 / 0.86; max-width: 100%; min-height: 320px; overflow: hidden; }
  .stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  .stage canvas:active { cursor: grabbing; }
  .stage .hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted); pointer-events: none; }
  .stage .nolib { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); font-size: 13px; }
  .stage .axes { position: absolute; right: 12px; top: 10px; font-family: var(--mono); font-size: 11px; color: var(--muted); pointer-events: none; text-align: right; line-height: 1.4; }

  .panel { display: grid; gap: 14px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; }
  h2 { font-family: var(--display); font-size: 15px; font-weight: 700; margin: 0; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  h2 span { font-family: var(--body); font-weight: 400; font-size: 12px; color: var(--muted); }

  .moves { display: grid; grid-template-columns: auto repeat(3, 1fr); gap: 6px; align-items: stretch; }
  .moves .rowlab { font-size: 12px; color: var(--muted); align-self: center; padding-right: 4px; white-space: nowrap; }
  .moves .rowlab b { display: block; color: var(--ink); font-weight: 600; }
  .mv { border: 1px solid var(--line-strong); background: var(--panel-2); color: var(--ink); border-radius: 8px; padding: 7px 6px 6px; cursor: pointer; display: grid; gap: 1px; text-align: center; font-family: var(--body); transition: transform 80ms ease, background 120ms ease; }
  .mv .n { font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1.1; }
  .mv .c { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .mv:hover { background: var(--btn-2); }
  .mv:active { transform: scale(0.96); }
  .mv:disabled { opacity: 0.5; cursor: default; }

  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn { border: 1px solid var(--line-strong); background: var(--panel-2); color: var(--ink); border-radius: 8px; padding: 7px 12px; font: 500 13px var(--body); cursor: pointer; }
  .btn:hover { background: var(--btn-2); }
  .btn.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
  .btn.primary:hover { filter: brightness(1.12); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  label.field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  input[type="text"] { width: 100%; border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; font: 13px var(--mono); background: var(--panel-2); color: var(--ink); }
  input[type="range"] { width: 130px; accent-color: var(--ink); }
  .speed { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-left: auto; }
  .msg { font-size: 12px; color: var(--muted); min-height: 1.2em; }
  .msg.warn { color: var(--warn); }
  .msg.good { color: var(--good); }

  .history { display: flex; flex-wrap: wrap; gap: 4px; min-height: 26px; }
  .history .tok { font: 12px var(--mono); padding: 2px 7px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); }
  .history .tok.last { border-color: var(--ink); }
  .history .empty { font-size: 12px; color: var(--muted); }

  .netwrap { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; }
  .net svg { display: block; }
  .state { font: 12px/1.7 var(--mono); color: var(--ink); overflow-wrap: anywhere; }
  .state b { color: var(--muted); font-weight: 500; }
  .kbd { font: 11px var(--mono); border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }

  @media (prefers-reduced-motion: reduce) { .mv, .btn { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Pocket Cube Playground</h1>
      <p class="sub">2×2×2 魔方环境的可视化：贴纸索引、9 个动作和奖励函数与 <code>rubik.py</code> 完全一致。</p>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">同色面 · check(s)</div><div class="v"><span id="stFaces">0</span><span class="pips" id="stPips"></span></div></div>
      <div class="stat"><div class="k">episode 状态</div><div class="v"><span class="pill" id="stDone">进行中</span></div></div>
      <div class="stat"><div class="k">已走步数 · count</div><div class="v"><span id="stMoves">0</span><small>/ 200</small></div></div>
    </div>
  </header>

  <main>
    <div class="stage">
      <canvas id="cv"></canvas>
      <div class="axes">x → right<br>y → back<br>z → top</div>
      <div class="hint">拖动旋转视角 · 滚轮缩放 · 键盘 <span class="kbd">T</span> <span class="kbd">R</span> <span class="kbd">F</span>，按住 Shift 反向</div>
    </div>

    <div class="panel">
      <section>
        <h2>动作 <span>a = 0…8，对应 take_action(a)</span></h2>
        <div class="moves" id="moves"></div>
        <div class="row">
          <button class="btn" id="btnUndo">撤销</button>
          <button class="btn" id="btnScramble">随机打乱 ×10</button>
          <button class="btn" id="btnReset">回到 reset() 状态</button>
          <button class="btn" id="btnSolvedState">六面复原态</button>
          <div class="speed"><span>速度</span><input type="range" id="speed" min="80" max="700" step="10" value="320"></div>
        </div>
        <div class="history" id="history"></div>
      </section>

      <section>
        <h2>动作序列 <span>t1 r3 f2 · 0 5 7 · U R' F2 都可以</span></h2>
        <label class="field" for="seq">输入序列后播放，或点“最短解法”自动求解并填入
          <input type="text" id="seq" placeholder="t1 r3 f2 …" autocomplete="off" spellcheck="false">
        </label>
        <div class="row">
          <button class="btn primary" id="btnPlay">播放</button>
          <button class="btn" id="btnSolve">最短解法</button>
          <button class="btn" id="btnStop">停止</button>
        </div>
        <div class="msg" id="seqMsg"></div>
      </section>

      <section>
        <h2>当前状态 <span>surface[face][pos]</span></h2>
        <div class="netwrap">
          <div class="net" id="net"></div>
          <div class="state" id="stateText"></div>
        </div>
      </section>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  // ---------- Model: identical to rubik.py ----------
  const F = 0, R = 1, T = 2, B = 3, L = 4, D = 5;
  const LT = 0, RT = 1, RB = 2, LB = 3;
  const FACE_NAME = ['front', 'right', 'top', 'back', 'left', 'bottom'];
  const INIT = [['w','g','g','b'], ['r','y','m','r'], ['g','r','w','r'], ['b','m','b','w'], ['y','b','y','w'], ['m','y','g','m']];
  const ACTIONS = ['t1','t2','t3','r1','r2','r3','f1','f2','f3'];
  const NOTATION = ['U','U2',"U'",'R','R2',"R'",'F','F2',"F'"];
  const INVERSE = [2,1,0, 5,4,3, 8,7,6];
  const COLORS = { w:'#F4F3EE', g:'#27A64A', b:'#2E67D9', r:'#D93A31', y:'#F5C531', m:'#D6449C' };

  const clone = s => s.map(f => f.slice());

  function twistTop(s) {
    const p = clone(s);
    s[F][LT] = p[R][LT]; s[F][RT] = p[R][RT];
    s[L][LT] = p[F][LT]; s[L][RT] = p[F][RT];
    s[B][LT] = p[L][LT]; s[B][RT] = p[L][RT];
    s[R][LT] = p[B][LT]; s[R][RT] = p[B][RT];
    s[T][LT] = p[T][LB]; s[T][RT] = p[T][LT]; s[T][RB] = p[T][RT]; s[T][LB] = p[T][RB];
  }
  function twistRight(s) {
    const p = clone(s);
    s[F][RT] = p[D][RT]; s[F][RB] = p[D][RB];
    s[T][RT] = p[F][RT]; s[T][RB] = p[F][RB];
    s[B][LB] = p[T][RT]; s[B][LT] = p[T][RB];
    s[D][RT] = p[B][LB]; s[D][RB] = p[B][LT];
    s[R][LT] = p[R][LB]; s[R][RT] = p[R][LT]; s[R][RB] = p[R][RT]; s[R][LB] = p[R][RB];
  }
  function twistFront(s) {
    const p = clone(s);
    s[R][LT] = p[T][LB]; s[R][LB] = p[T][RB];
    s[T][LB] = p[L][RB]; s[T][RB] = p[L][RT];
    s[L][RT] = p[D][LT]; s[L][RB] = p[D][RT];
    s[D][LT] = p[R][LB]; s[D][RT] = p[R][LT];
    s[F][LT] = p[F][LB]; s[F][RT] = p[F][LT]; s[F][RB] = p[F][RT]; s[F][LB] = p[F][RB];
  }
  const TWIST = [twistTop, twistRight, twistFront];
  function applyAction(s, a) { const k = a % 3 + 1; for (let i = 0; i < k; i++) TWIST[Math.floor(a / 3)](s); }
  function check(s) { let n = 0; for (let f = 0; f < 6; f++) if (new Set(s[f]).size === 1) n++; return n; }
  const key = s => s.map(f => f.join('')).join('');
  const fromKey = k => [0,1,2,3,4,5].map(f => k.slice(f * 4, f * 4 + 4).split(''));

  // Corners: (cubie position, its three sticker slots). back-left-bottom never moves under t/r/f.
  const CORNERS = [
    [[F,RT],[R,LT],[T,RB]], [[F,LT],[L,RT],[T,LB]], [[F,RB],[R,LB],[D,RT]], [[F,LB],[L,RB],[D,LT]],
    [[B,LT],[R,RT],[T,RT]], [[B,RT],[L,LT],[T,LT]], [[B,LB],[R,RB],[D,RB]], [[B,RB],[L,LB],[D,LB]],
  ];
  function solvedTarget(s) {
    // Derive the solved state implied by the fixed corner and the colour pairing; null if impossible.
    const adj = {};
    for (const c of CORNERS) {
      const cols = c.map(([f, p]) => s[f][p]);
      if (new Set(cols).size !== 3) return null;
      for (const a of cols) { adj[a] = adj[a] || new Set(); for (const b of cols) if (a !== b) adj[a].add(b); }
    }
    const all = Object.keys(adj);
    if (all.length !== 6) return null;
    const opp = {};
    for (const a of all) { const rest = all.filter(b => b !== a && !adj[a].has(b)); if (rest.length !== 1) return null; opp[a] = rest[0]; }
    const back = s[B][RB], left = s[L][LB], bottom = s[D][LB];
    const t = [];
    t[F] = opp[back]; t[R] = opp[left]; t[T] = opp[bottom]; t[B] = back; t[L] = left; t[D] = bottom;
    return t.map(c => [c, c, c, c]);
  }
  function bfsLayer(start, depth) {
    const seen = new Map([[key(start), [null, -1]]]);
    let frontier = [start];
    for (let d = 0; d < depth; d++) {
      const next = [];
      for (const s of frontier) {
        const ks = key(s);
        for (let a = 0; a < 9; a++) {
          const n = clone(s); applyAction(n, a); const kn = key(n);
          if (!seen.has(kn)) { seen.set(kn, [ks, a]); next.push(n); }
        }
      }
      frontier = next;
    }
    return seen;
  }
  function pathTo(seen, k) { const out = []; while (seen.get(k)[0] !== null) { const [prev, a] = seen.get(k); out.push(a); k = prev; } return out.reverse(); }
  function solve(s) {
    const target = solvedTarget(s);
    if (!target) return { error: 'invalid' };
    if (key(s) === key(target)) return { moves: [] };
    const fwd = bfsLayer(s, 6), bwd = bfsLayer(target, 6);
    let best = null;
    for (const k of fwd.keys()) {
      if (!bwd.has(k)) continue;
      const p = pathTo(fwd, k).concat(pathTo(bwd, k).reverse().map(a => INVERSE[a]));
      if (!best || p.length < best.length) best = p;
    }
    return best ? { moves: best } : { error: 'unreachable' };
  }

  // ---------- Geometry: sticker slots from rubik.py's update_rubik ----------
  // [face][pos] -> {c: centre, n: outward normal}
  const SLOT = [];
  SLOT[F] = { [LT]: [-0.5,-1, 0.5], [LB]: [-0.5,-1,-0.5], [RT]: [ 0.5,-1, 0.5], [RB]: [ 0.5,-1,-0.5] };
  SLOT[B] = { [RT]: [-0.5, 1, 0.5], [RB]: [-0.5, 1,-0.5], [LT]: [ 0.5, 1, 0.5], [LB]: [ 0.5, 1,-0.5] };
  SLOT[R] = { [LT]: [ 1,-0.5, 0.5], [RT]: [ 1, 0.5, 0.5], [LB]: [ 1,-0.5,-0.5], [RB]: [ 1, 0.5,-0.5] };
  SLOT[L] = { [RT]: [-1,-0.5, 0.5], [LT]: [-1, 0.5, 0.5], [RB]: [-1,-0.5,-0.5], [LB]: [-1, 0.5,-0.5] };
  SLOT[T] = { [LT]: [-0.5, 0.5, 1], [RT]: [ 0.5, 0.5, 1], [RB]: [ 0.5,-0.5, 1], [LB]: [-0.5,-0.5, 1] };
  SLOT[D] = { [LB]: [-0.5, 0.5,-1], [RB]: [ 0.5, 0.5,-1], [RT]: [ 0.5,-0.5,-1], [LT]: [-0.5,-0.5,-1] };
  const NORMAL = []; NORMAL[F] = [0,-1,0]; NORMAL[B] = [0,1,0]; NORMAL[R] = [1,0,0]; NORMAL[L] = [-1,0,0]; NORMAL[T] = [0,0,1]; NORMAL[D] = [0,0,-1];
  // layer: 0 top (z>0, about z), 1 right (x>0, about x), 2 front (y<0, about y)
  const LAYER = [
    { axis: 'z', sign: -1, sel: p => p.z > 0.1 },
    { axis: 'x', sign: -1, sel: p => p.x > 0.1 },
    { axis: 'y', sign:  1, sel: p => p.y < -0.1 },
  ];

  // ---------- Three.js scene ----------
  const canvas = document.getElementById('cv');
  const has3d = typeof THREE !== 'undefined';
  let scene, camera, root, pivot;
  const cubies = [], stickers = []; // stickers: {face,pos,mesh,pos0,quat0}
  if (!has3d) {
    const note = document.createElement('div'); note.className = 'nolib';
    note.textContent = '3D 库（three.js, cdnjs）没有加载成功，只显示右侧展开图。';
    canvas.parentNode.appendChild(note);
  }
  const renderer = has3d ? new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }) : null;
  if (has3d) {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.outputEncoding = THREE.sRGBEncoding;
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
  camera.up.set(0, 0, 1);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x50566a, 0.95));
  const sun = new THREE.DirectionalLight(0xffffff, 0.75); sun.position.set(3, -4, 6); scene.add(sun);
  const fill = new THREE.DirectionalLight(0xffffff, 0.25); fill.position.set(-4, 3, -2); scene.add(fill);

  root = new THREE.Group(); scene.add(root);
  pivot = new THREE.Group(); root.add(pivot);

  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1a1d24, roughness: 0.55, metalness: 0.05 });
  const cubieGeo = new THREE.BoxGeometry(0.97, 0.97, 0.97);
  for (const x of [-0.5, 0.5]) for (const y of [-0.5, 0.5]) for (const z of [-0.5, 0.5]) {
    const m = new THREE.Mesh(cubieGeo, bodyMat); m.position.set(x, y, z); root.add(m); cubies.push(m);
  }
  function roundedRect(w, h, r) {
    const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
    s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
    s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
    s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
    return s;
  }
  const stickerGeo = new THREE.ShapeGeometry(roundedRect(0.84, 0.84, 0.12));
  for (let f = 0; f < 6; f++) for (let p = 0; p < 4; p++) {
    const c = SLOT[f][p], n = NORMAL[f];
    const mat = new THREE.MeshStandardMaterial({ roughness: 0.4, metalness: 0 });
    const mesh = new THREE.Mesh(stickerGeo, mat);
    // sit just outside the cubie surface (cubie face is at 0.985 from origin along the normal)
    mesh.position.set(c[0] - n[0] * 0.006, c[1] - n[1] * 0.006, c[2] - n[2] * 0.006);
    if (n[2] !== 0) mesh.up.set(0, 1, 0); else mesh.up.set(0, 0, 1);
    mesh.lookAt(mesh.position.x + n[0], mesh.position.y + n[1], mesh.position.z + n[2]);
    root.add(mesh);
    stickers.push({ face: f, pos: p, mesh, pos0: mesh.position.clone(), quat0: mesh.quaternion.clone() });
  }

  // camera orbit (z-up)
  let theta = -0.95, phi = 0.48, dist = 6.4;
  function placeCamera() {
    camera.position.set(dist * Math.cos(phi) * Math.cos(theta), dist * Math.cos(phi) * Math.sin(theta), dist * Math.sin(phi));
    camera.lookAt(0, 0, 0);
  }
  let drag = null;
  canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => {
    if (!drag) return;
    theta -= (e.clientX - drag.x) * 0.008; phi += (e.clientY - drag.y) * 0.008;
    phi = Math.max(-1.45, Math.min(1.45, phi)); drag = { x: e.clientX, y: e.clientY }; placeCamera();
  });
  canvas.addEventListener('pointerup', () => { drag = null; });
  canvas.addEventListener('pointercancel', () => { drag = null; });
  canvas.addEventListener('wheel', e => { e.preventDefault(); dist = Math.max(4, Math.min(11, dist + e.deltaY * 0.004)); placeCamera(); }, { passive: false });
  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(canvas);
  resize(); placeCamera();
  }

  // ---------- State + view sync ----------
  let state = clone(INIT);
  let history = [];      // actions since last reset
  let busy = false;
  let queue = [];        // {a, dur}
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);

  function paintStickers() {
    if (!has3d) return;
    for (const st of stickers) st.mesh.material.color.set(COLORS[state[st.face][st.pos]]).convertSRGBToLinear();
  }
  function resetTransforms() {
    if (!has3d) return;
    for (const st of stickers) { st.mesh.position.copy(st.pos0); st.mesh.quaternion.copy(st.quat0); }
    for (const c of cubies) { c.position.set(Math.sign(c.position.x) * 0.5, Math.sign(c.position.y) * 0.5, Math.sign(c.position.z) * 0.5); c.rotation.set(0, 0, 0); }
    pivot.rotation.set(0, 0, 0);
  }
  function renderNet() {
    const cell = 20, gap = 2, pad = 6, faceW = 2 * cell + gap;
    // net columns: L F R B ; T above F ; D below F
    const col = { [L]: 0, [F]: 1, [R]: 2, [B]: 3, [T]: 1, [D]: 1 };
    const row = { [T]: 0, [L]: 1, [F]: 1, [R]: 1, [B]: 1, [D]: 2 };
    const W = 4 * faceW + 3 * pad, H = 3 * faceW + 2 * pad;
    let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="魔方展开图">`;
    const order = [LT, RT, LB, RB];
    for (let f = 0; f < 6; f++) {
      const ox = col[f] * (faceW + pad), oy = row[f] * (faceW + pad);
      order.forEach((p, i) => {
        const x = ox + (i % 2) * (cell + gap), y = oy + Math.floor(i / 2) * (cell + gap);
        svg += `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="3" fill="${COLORS[state[f][p]]}" stroke="rgba(0,0,0,0.25)"><title>${FACE_NAME[f]}[${p}] = ${state[f][p]}</title></rect>`;
      });
    }
    svg += '</svg>';
    $('net').innerHTML = svg;
  }
  function renderState() {
    const faces = check(state);
    $('stFaces').textContent = faces;
    $('stPips').innerHTML = Array.from({ length: 6 }, (_, i) => `<span class="pip${i < faces ? ' on' : ''}"></span>`).join('');
    const done = faces > 1;
    const pill = $('stDone'); pill.textContent = done ? `done · reward ${faces}` : `reward ${faces}`; pill.className = 'pill' + (done ? ' good' : '');
    $('stMoves').textContent = history.length;
    $('history').innerHTML = history.length
      ? history.map((a, i) => `<span class="tok${i === history.length - 1 ? ' last' : ''}">${ACTIONS[a]}</span>`).join('')
      : '<span class="empty">还没有动作。点击上方按钮，或按 T / R / F。</span>';
    $('stateText').innerHTML = FACE_NAME.map((n, f) => `<b>${n.padEnd(6, ' ').replace(/ /g, '&nbsp;')}</b> ${state[f].join(' ')}`).join('<br>')
      + `<br><b>state&nbsp;</b> ${key(state)}`;
    renderNet();
    $('btnUndo').disabled = history.length === 0 || busy;
    document.querySelectorAll('.mv').forEach(b => { b.disabled = busy; });
  }
  function commit() { paintStickers(); renderState(); }

  function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function animateAction(a, dur, done) {
    if (!has3d) { applyAction(state, a); commit(); done(); return; }
    const layer = LAYER[Math.floor(a / 3)], k = a % 3 + 1;
    const quarters = k === 3 ? -1 : k;
    const target = layer.sign * quarters * Math.PI / 2;
    const parts = cubies.concat(stickers.map(s => s.mesh)).filter(m => layer.sel(m.position));
    parts.forEach(m => pivot.attach(m));
    const t0 = performance.now();
    const total = reduced ? 0 : dur * (k === 2 ? 1.35 : 1);
    function step(now) {
      const t = total ? Math.min(1, (now - t0) / total) : 1;
      pivot.rotation[layer.axis] = target * easeInOutCubic(t);
      if (t < 1) { requestAnimationFrame(step); return; }
      parts.forEach(m => root.attach(m));
      resetTransforms();
      applyAction(state, a);
      commit();
      done();
    }
    requestAnimationFrame(step);
  }
  function pump() {
    if (busy || !queue.length) { if (!busy) renderState(); return; }
    const { a, dur } = queue.shift();
    busy = true; renderState();
    animateAction(a, dur, () => { busy = false; pump(); });
  }
  function enqueue(a, dur) {
    history.push(a);
    queue.push({ a, dur: dur ?? Number($('speed').value) });
    pump();
  }
  function setState(next, msg) {
    queue = []; state = clone(next); history = []; commit();
    if (msg !== undefined) setMsg(msg);
  }
  function setMsg(text, kind) { const el = $('seqMsg'); el.textContent = text; el.className = 'msg' + (kind ? ' ' + kind : ''); }

  // ---------- Controls ----------
  const movesEl = $('moves');
  [['Top', 't'], ['Right', 'r'], ['Front', 'f']].forEach(([name, code], row) => {
    const lab = document.createElement('div'); lab.className = 'rowlab'; lab.innerHTML = `<b>${name}</b>twist_${name.toLowerCase()}`; movesEl.appendChild(lab);
    for (let k = 0; k < 3; k++) {
      const a = row * 3 + k;
      const b = document.createElement('button'); b.className = 'mv'; b.type = 'button'; b.title = `${ACTIONS[a]}：${name} 层转 ${90 * (k + 1)}°`;
      b.innerHTML = `<span class="n">${NOTATION[a]}</span><span class="c">${ACTIONS[a]} · a=${a}</span>`;
      b.addEventListener('click', () => enqueue(a));
      movesEl.appendChild(b);
    }
  });
  $('btnUndo').addEventListener('click', () => {
    if (busy || !history.length) return;
    const last = history.pop();
    // play the inverse without recording it
    queue.push({ a: INVERSE[last], dur: Number($('speed').value) }); pump();
  });
  $('btnScramble').addEventListener('click', () => {
    let prev = -1;
    for (let i = 0; i < 10; i++) {
      let layer; do { layer = Math.floor(Math.random() * 3); } while (layer === prev);
      prev = layer; enqueue(layer * 3 + Math.floor(Math.random() * 3), 110);
    }
    setMsg('');
  });
  $('btnReset').addEventListener('click', () => setState(INIT, ''));
  $('btnSolvedState').addEventListener('click', () => {
    const t = solvedTarget(state);
    if (t) setState(t, '已切换到与当前固定角块（back-left-bottom）一致的复原态。');
    else setState([['g','g','g','g'],['r','r','r','r'],['y','y','y','y'],['b','b','b','b'],['w','w','w','w'],['m','m','m','m']], '当前状态的角块颜色不自洽，改用默认复原态。', 'warn');
  });
  $('btnStop').addEventListener('click', () => { history.length -= queue.length; queue = []; renderState(); });

  function parseSeq(text) {
    const map = {};
    ACTIONS.forEach((c, i) => { map[c] = i; map[String(i)] = i; map[NOTATION[i].toLowerCase()] = i; });
    const toks = text.trim().split(/[\s,]+/).filter(Boolean);
    const out = [];
    for (const t of toks) { const a = map[t.toLowerCase()]; if (a === undefined) return { error: t }; out.push(a); }
    return { moves: out };
  }
  function playSeq() {
    const r = parseSeq($('seq').value);
    if (r.error) { setMsg(`看不懂 “${r.error}”。可用：t1…f3、0…8、U R F（可加 2 或 '）。`, 'warn'); return; }
    if (!r.moves.length) { setMsg('序列为空。', 'warn'); return; }
    setMsg(`播放 ${r.moves.length} 步…`);
    r.moves.forEach(a => enqueue(a));
  }
  $('btnPlay').addEventListener('click', playSeq);
  $('seq').addEventListener('keydown', e => { if (e.key === 'Enter') playSeq(); });
  $('btnSolve').addEventListener('click', () => {
    if (busy) return;
    setMsg('正在做双向 BFS 搜索…');
    setTimeout(() => {
      const r = solve(state);
      if (r.error === 'invalid') { setMsg('当前状态的角块颜色不自洽，不是一个物理上存在的魔方，无法求解。', 'warn'); return; }
      if (r.error === 'unreachable') { setMsg('12 步内搜不到解。合法状态最多 11 步可复原，所以这个状态不可复原（角块方向或排列奇偶性不对）。', 'warn'); return; }
      if (!r.moves.length) { setMsg('已经是复原态。', 'good'); return; }
      $('seq').value = r.moves.map(a => ACTIONS[a]).join(' ');
      setMsg(`最短解 ${r.moves.length} 步：${r.moves.map(a => NOTATION[a]).join(' ')}`, 'good');
      r.moves.forEach(a => enqueue(a));
    }, 20);
  });

  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
    const row = { t: 0, r: 1, f: 2 }[e.key.toLowerCase()];
    if (row === undefined) return;
    enqueue(row * 3 + (e.shiftKey ? 2 : 0));
  });

  // ---------- Boot (keeps state across republishes) ----------
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    window.claude.hot.snapshot(() => ({ state: key(state), history: history.slice(), seq: $('seq').value }));
  }
  function start(data) {
    if (data && data.state && data.state.length === 24) { state = fromKey(data.state); history = data.history || []; if (data.seq) $('seq').value = data.seq; }
    commit();
    if (has3d) (function loop() { renderer.render(scene, camera); requestAnimationFrame(loop); })();
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
</body>
</html>
